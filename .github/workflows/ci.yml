name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build binaries
        run: make build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostmail-linux-amd64
          path: bin/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ghostmail:ci .

      - name: Smoke test
        run: |
          docker run -d --name ghostmail-test \
            -e GHOSTMAIL_HOSTNAME=localhost \
            -e GHOSTMAIL_DOMAIN=localhost \
            -e GHOSTMAIL_ADMIN_USER=admin \
            -e GHOSTMAIL_ADMIN_PASSWORD=testpass123 \
            -e GHOSTMAIL_DATA_DIR=/var/lib/ghostmail \
            -e GHOSTMAIL_ADMIN_ADDR=:8080 \
            -p 8080:8080 \
            ghostmail:ci
          sleep 5
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
          docker stop ghostmail-test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, build, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cross-compile
        run: make release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
