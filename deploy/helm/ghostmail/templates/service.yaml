apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ghostmail
  labels:
    app: ghostmail
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: smtp
      port: {{ .Values.service.smtp }}
      targetPort: smtp
      protocol: TCP
    - name: submission
      port: {{ .Values.service.submission }}
      targetPort: submission
      protocol: TCP
    - name: imap
      port: {{ .Values.service.imap }}
      targetPort: imap
      protocol: TCP
    - name: http
      port: {{ .Values.admin.port }}
      targetPort: http
      protocol: TCP
  selector:
    app: ghostmail
    release: {{ .Release.Name }}
