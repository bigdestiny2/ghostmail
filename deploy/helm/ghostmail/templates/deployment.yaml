apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ghostmail
  labels:
    app: ghostmail
    release: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ghostmail
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: ghostmail
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: ghostmail
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GHOSTMAIL_DOMAIN
              value: {{ .Values.domain | quote }}
            - name: GHOSTMAIL_HOSTNAME
              value: {{ default (printf "mail.%s" .Values.domain) .Values.hostname | quote }}
            - name: GHOSTMAIL_ADMIN_USER
              value: {{ .Values.admin.username | quote }}
            - name: GHOSTMAIL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-ghostmail-secret
                  key: admin-password
            - name: GHOSTMAIL_DATA_DIR
              value: /var/lib/ghostmail
            - name: GHOSTMAIL_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: GHOSTMAIL_ADMIN_ADDR
              value: ":8080"
          ports:
            - name: smtp
              containerPort: 25
              protocol: TCP
            - name: submission
              containerPort: 587
              protocol: TCP
            - name: imap
              containerPort: 993
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/ghostmail
            - name: config
              mountPath: /etc/ghostmail
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ghostmail-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ghostmail-config
          {{- else }}
          emptyDir: {}
          {{- end }}
