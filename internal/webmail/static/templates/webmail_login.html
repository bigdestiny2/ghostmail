{{define "webmail_login"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostMail - Login</title>
    <link rel="stylesheet" href="/mail/static/css/webmail.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>GhostMail</h1>
            <p class="subtitle">Encrypted Webmail</p>
            <div id="login-error" class="error-msg"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" placeholder="user@domain.com" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
            </form>
        </div>
    </div>
    <script src="/mail/static/js/login.js"></script>
</body>
</html>
{{end}}
