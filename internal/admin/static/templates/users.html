{{define "content"}}
<div class="flex-between mb-1">
  <h2>Users</h2>
</div>

<div class="card mb-1">
  <h3 style="margin-bottom:0.75rem">Create User</h3>
  <form method="POST" action="/admin/users">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-row">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="alice" required>
      </div>
      <div class="form-group">
        <label for="domain">Domain</label>
        <select id="domain" name="domain" required>
          {{range .Data.Domains}}<option value="{{.Name}}">{{.Name}}</option>{{end}}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end">
        <button type="submit" class="btn btn-primary">Create User</button>
      </div>
    </div>
  </form>
</div>

<div class="card">
  <table>
    <thead>
      <tr><th>Address</th><th>Admin</th><th>Created</th><th>Quota</th><th></th></tr>
    </thead>
    <tbody>
    {{range .Data.Users}}
      <tr>
        <td>{{.Username}}@{{.Domain}}</td>
        <td>{{if .IsAdmin}}Yes{{end}}</td>
        <td>{{.CreatedAt.Format "2006-01-02"}}</td>
        <td>{{printf "%.0f" (divf .QuotaBytes 1048576)}} MB</td>
        <td class="text-right">
          <form method="POST" action="/admin/users/delete" style="display:inline"
                onsubmit="return confirm('Delete this user and all their data?')">
            <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
            <input type="hidden" name="id" value="{{.ID}}">
            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
          </form>
        </td>
      </tr>
    {{else}}
      <tr><td colspan="5" class="text-muted">No users yet.</td></tr>
    {{end}}
    </tbody>
  </table>
</div>
{{end}}
